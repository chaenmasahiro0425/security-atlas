name: Daily security collection
on:
  schedule:
    - cron: '17 23 * * *' # 08:17 Asia/Tokyo; GitHub may delay scheduled runs
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-security-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Restore the last successful collection
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous_run=$(gh api "repos/$GH_REPO/actions/workflows/daily-security.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" --name "security-news-$previous_run" --dir /tmp/previous-security
          fi
      - name: Collect feeds without altering approved incident data
        run: |
          previous_file=public/data/security-news.json
          if [ -f /tmp/previous-security/security-news.json ]; then
            previous_file=/tmp/previous-security/security-news.json
          fi
          python3 scripts/collect-security.py --previous "$previous_file" --output /tmp/security-news.json
      - name: Publish immutable snapshot for the approved production watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-security.py
      - name: Save collection for review (including partial failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-news-${{ github.run_id }}
          path: /tmp/security-news.json
          if-no-files-found: error
          retention-days: 90
