name: Validate
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/security-atlas-vite.log 2>&1 &
      - run: npx wait-on http://127.0.0.1:3182
      - run: npx playwright test tests/ui.spec.ts tests/experience.spec.ts tests/legal.spec.ts tests/feed.spec.ts --workers=1
